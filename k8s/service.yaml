apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
  namespace: default
  labels:
    app: ml-inference
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  type: LoadBalancer
  selector:
    app: ml-inference
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
