apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-inference-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-inference-deployment
  # Minimum et maximum de répliques (instances)
  minReplicas: 2
  maxReplicas: 8
  metrics:
  # Déclencher une mise à l'échelle si le CPU dépasse 70%
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
