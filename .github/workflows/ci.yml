name: MLOps Platform CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ml-inference-api

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build React frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Validate deployment artifacts
        run: pytest tests/test_project_artifacts.py -v

      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_EXPERIMENT_NAME: ITGate_Revenue_Forecast
          RAG_EXPERIMENT_NAME: RAG_Document_QA
          GROQ_API_KEY: test-key-not-used-in-mocked-tests
        run: pytest tests/ -v

      - name: Prepare model artifacts for Docker build
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_EXPERIMENT_NAME: ITGate_Revenue_Forecast
        run: python src/train.py --run_name "ci_docker_model" --n_estimators 50 --max_depth 5

      - name: Prepare Docker metadata
        id: docker_meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          image_repo=$(echo "${REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ml-inference-api:ci \
            -t ml-inference-api:${{ steps.docker_meta.outputs.sha_short }} \
            -t ${{ steps.docker_meta.outputs.image_repo }}:${{ steps.docker_meta.outputs.sha_short }} \
            -t ${{ steps.docker_meta.outputs.image_repo }}:latest \
            --build-arg APP_VERSION=${{ steps.docker_meta.outputs.sha_short }} \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BUILD_DATE=${{ steps.docker_meta.outputs.build_date }} \
            .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ steps.docker_meta.outputs.image_repo }}:${{ steps.docker_meta.outputs.sha_short }}
          docker push ${{ steps.docker_meta.outputs.image_repo }}:latest
